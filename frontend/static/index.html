<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeTrotter AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0284c7;
    --accent-dark: #0369a1;
    --accent-light: #e0f2fe;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 12px rgba(2, 132, 199, 0.08);
  }

  body.dark-mode {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --border: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent-light: #1e3a8a;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: background 0.2s ease, color 0.2s ease;
  }

  header {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #fff;
    padding: 0.8rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 10px rgba(2, 132, 199, 0.2);
    z-index: 10;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .header-avatar {
    width: 38px;
    height: 38px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    backdrop-filter: blur(4px);
  }

  .header-title {
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
  }

  .header-subtitle {
    font-size: 0.75rem;
    opacity: 0.9;
    font-weight: 400;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .header-btn {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    padding: 0.35rem 0.7rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    transition: background 0.15s ease;
    backdrop-filter: blur(4px);
  }

  .header-btn:hover {
    background: rgba(255, 255, 255, 0.3);
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    background: rgba(255, 255, 255, 0.15);
    padding: 0.3rem 0.7rem;
    border-radius: 20px;
    backdrop-filter: blur(4px);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: #34d399;
    border-radius: 50%;
    box-shadow: 0 0 6px #34d399;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .msg-row {
    display: flex;
    gap: 0.75rem;
    max-width: 88%;
    animation: fadeIn 0.2s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg-row.agent {
    align-self: flex-start;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    flex-shrink: 0;
  }

  .msg-row.agent .avatar {
    background: var(--accent-light);
    color: var(--accent);
    border: 1px solid rgba(2, 132, 199, 0.2);
  }

  .msg-row.user .avatar {
    background: var(--accent);
    color: #fff;
  }

  .bubble-wrapper {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    width: 100%;
  }

  .msg-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }

  .msg-author {
    font-size: 0.725rem;
    color: var(--text-secondary);
    font-weight: 600;
  }

  .msg-row.user .msg-header-row {
    flex-direction: row-reverse;
  }

  .copy-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 0.75rem;
    cursor: pointer;
    padding: 0.1rem 0.3rem;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 0.2rem;
    opacity: 0.7;
    transition: opacity 0.15s ease, background 0.15s ease;
  }

  .copy-btn:hover {
    opacity: 1;
    background: rgba(0,0,0,0.05);
  }

  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.5;
    word-break: break-word;
    box-shadow: var(--shadow-sm);
    position: relative;
  }

  .msg-row.user .bubble {
    background: var(--accent);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }

  .msg-row.agent .bubble {
    background: var(--card-bg);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
    width: 100%;
  }

  /* --- Typing Indicator --- */
  .typing-indicator {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.6rem 0.9rem;
  }

  .typing-dot {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: typingBounce 1.2s infinite ease-in-out;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  .typing-text {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-left: 0.4rem;
  }

  /* --- A2UI component styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.2rem;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    max-width: 100%;
    border-top: 3px solid var(--accent);
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-caption { font-size: 0.8rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: var(--radius-md); display: block; cursor: pointer; transition: transform 0.15s ease; }
  .a2img:hover { transform: scale(1.01); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }

  /* Controls & Input Section */
  .input-container {
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    padding: 0.75rem 1rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
  }

  .examples-row {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.2rem;
  }

  .example-btn {
    flex: 1;
    min-width: 0;
    padding: 0.45rem 0.85rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.825rem;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
    transition: all 0.15s ease;
  }

  .example-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
  }

  form {
    display: flex;
    gap: 0.6rem;
    align-items: center;
  }

  input {
    flex: 1;
    padding: 0.8rem 1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    background: var(--bg);
    color: var(--text-primary);
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    background: var(--card-bg);
  }

  button.send-btn {
    padding: 0.8rem 1.4rem;
    border: none;
    border-radius: var(--radius-md);
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.10s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  button.send-btn:hover {
    background: var(--accent-dark);
  }

  button.send-btn:active {
    transform: scale(0.98);
  }

  /* Lightbox Modal */
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(4px);
  }

  .lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: var(--radius-md);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #0f172a;
    color: #fff;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    font-size: 0.825rem;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    z-index: 50;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<header>
  <div class="header-brand">
    <div class="header-avatar">✈️</div>
    <div>
      <div class="header-title">GlobeTrotter AI</div>
      <div class="header-subtitle">Your AI Travel Concierge</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="header-btn" id="theme-btn" title="Toggle Theme">
      <span>🌙</span>
    </button>
    <button class="header-btn" id="clear-btn" title="New Trip / Clear Chat">
      <span>🔄</span>
      <span>New Trip</span>
    </button>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Online</span>
    </div>
  </div>
</header>

<div id="log"></div>

<div class="input-container">
  <div class="examples-row" id="examples">
    <button type="button" class="example-btn" data-prompt="Find top attractions in Tokyo">⛩️ Attractions in Tokyo</button>
    <button type="button" class="example-btn" data-prompt="Calculate a 5-day budget for Paris in EUR">💶 5-Day Paris Budget</button>
    <button type="button" class="example-btn" data-prompt="Generate a postcard of Mount Fuji at sunset">🖼️ Mount Fuji Postcard</button>
  </div>
  <form id="form">
    <input id="input" placeholder="Plan your trip, ask for attractions, budget, or postcards..." autocomplete="off" autofocus>
    <button type="submit" class="send-btn">
      <span>Send</span>
      <span class="material-symbols-outlined" style="font-size:1.1rem; color:#fff;">send</span>
    </button>
  </form>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="" alt="Full size preview">
</div>

<div class="toast" id="toast">Copied to clipboard!</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const toast = document.getElementById("toast");
const themeBtn = document.getElementById("theme-btn");
const clearBtn = document.getElementById("clear-btn");

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "✈️");
  const wrapper = el("div", "bubble-wrapper");
  const headerRow = el("div", "msg-header-row");
  const author = el("div", "msg-author", who === "user" ? "You" : "GlobeTrotter AI");
  const b = el("div", "bubble");

  headerRow.appendChild(author);

  if (who === "agent") {
    const copyBtn = el("button", "copy-btn", "📋 Copy");
    copyBtn.type = "button";
    copyBtn.onclick = () => {
      const textToCopy = b.innerText || b.textContent;
      navigator.clipboard.writeText(textToCopy).then(() => showToast("Itinerary copied to clipboard!"));
    };
    headerRow.appendChild(copyBtn);
  }

  wrapper.appendChild(headerRow);
  wrapper.appendChild(b);
  row.appendChild(avatar);
  row.appendChild(wrapper);

  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

function showTypingIndicator() {
  const row = el("div", "msg-row agent", null);
  row.id = "typing-row";
  const avatar = el("div", "avatar", "✈️");
  const wrapper = el("div", "bubble-wrapper");
  const author = el("div", "msg-author", "GlobeTrotter AI");
  const b = el("div", "bubble");

  const indicator = el("div", "typing-indicator");
  indicator.appendChild(el("div", "typing-dot"));
  indicator.appendChild(el("div", "typing-dot"));
  indicator.appendChild(el("div", "typing-dot"));
  indicator.appendChild(el("span", "typing-text", "Planning your journey..."));

  b.appendChild(indicator);
  wrapper.appendChild(author);
  wrapper.appendChild(b);
  row.appendChild(avatar);
  row.appendChild(wrapper);

  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function removeTypingIndicator() {
  const t = document.getElementById("typing-row");
  if (t) t.remove();
}

/* A2UI Mini-Renderer */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || "";
      img.onclick = () => {
        lightboxImg.src = src;
        lightbox.style.display = "flex";
      };
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  const list = Array.isArray(messages) ? messages.flat(2) : [messages];

  for (const m of list) {
    if (!m || typeof m !== "object") continue;
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate || (Array.isArray(m.components) ? m : null);
    if (su && Array.isArray(su.components)) {
      for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
    }
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function processParts(parts) {
  const cleanTexts = [];
  const a2uiData = [];

  for (const p of parts) {
    if (!p) continue;
    if (p.kind === "a2ui" && p.data) {
      a2uiData.push(p.data);
    } else if (p.kind === "text" || p.text) {
      let text = p.text || "";
      const match = text.match(/<(a2ui-json|a2a_datapart_json)>([\s\S]*?)<\/\1>/);
      if (match) {
        const prefix = text.substring(0, match.index).trim();
        const suffix = text.substring(match.index + match[0].length).trim();
        if (prefix) cleanTexts.push(prefix);
        if (suffix) cleanTexts.push(suffix);
        try {
          const parsed = JSON.parse(match[2].trim());
          if (parsed && typeof parsed === "object" && parsed.kind === "data" && parsed.data) {
            a2uiData.push(parsed.data);
          } else if (parsed) {
            a2uiData.push(parsed);
          }
        } catch (e) {
          console.error("Error parsing tag JSON:", e);
        }
      } else if (text.trim().startsWith("{") && (text.includes('"components"') || text.includes('"surfaceId"') || text.includes('"surfaceld"'))) {
        try {
          const parsed = JSON.parse(text.trim());
          a2uiData.push(parsed);
        } catch (e) {
          cleanTexts.push(text);
        }
      } else {
        cleanTexts.push(text);
      }
    }
  }

  return { cleanTexts, a2uiData };
}

function renderReply(b, parts) {
  b.textContent = "";
  const { cleanTexts, a2uiData } = processParts(parts || []);

  const textStr = cleanTexts.join("\n").trim();
  if (textStr) {
    const textNode = el("div", null, textStr);
    textNode.style.marginBottom = a2uiData.length ? "0.75rem" : "0";
    b.appendChild(textNode);
  }

  if (a2uiData.length) {
    b.classList.add("rich");
    if (!renderSurface(a2uiData, b)) {
      b.appendChild(el("div", null, flattenText(a2uiData) || "(no card content)"));
    }
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

lightbox.onclick = () => lightbox.style.display = "none";

themeBtn.onclick = () => {
  document.body.classList.toggle("dark-mode");
  const isDark = document.body.classList.contains("dark-mode");
  themeBtn.querySelector("span").textContent = isDark ? "☀️" : "🌙";
  showToast(isDark ? "Dark Mode Enabled" : "Light Mode Enabled");
};

clearBtn.onclick = () => {
  log.innerHTML = "";
  showToast("Trip session cleared!");
};

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  showTypingIndicator();

  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    removeTypingIndicator();
    const b = bubble("agent");
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    removeTypingIndicator();
    const b = bubble("agent");
    b.textContent = "Error: " + e.message;
  }
});

document.querySelectorAll(".example-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    input.value = btn.getAttribute("data-prompt") || btn.textContent;
    form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
  });
});
</script>
</body>
</html>
